# Бесплатный HTTPS-хостинг на GitHub Pages: сборка и публикация при каждом push в main.
# Настройка: Settings → Pages → Source: GitHub Actions.
# ID приложения VK можно задать переменной репозитория VK_APP_ID (Settings → Secrets and variables → Actions → Variables)
# или ввести в самом приложении (Настройки → Приложение ВКонтакте). Это не секрет.
name: Deploy iTools to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_VK_APP_ID: ${{ vars.VK_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
