<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="iTools — VK Smart Publisher: массовая загрузка, редактирование и публикация записей ВКонтакте." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="iTools" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>iTools</title>
    <style>
      /* Splash Screen: виден до монтирования React */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff; z-index: 9999; transition: opacity .25s ease; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 32px rgba(37, 99, 235, .25); }
      #splash b { font-size: 22px; color: #0f172a; letter-spacing: -.02em; }
      #splash span { font-size: 13px; color: #64748b; }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="./icons/icon-192.png" alt="" />
      <b>iTools</b>
      <span>VK Smart Publisher</span>
    </div>
    <div id="root"></div>
    <noscript>Для работы iTools включите JavaScript.</noscript>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
